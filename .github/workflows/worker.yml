name: WhatsApp Worker

# Worker Baileys dijalankan di GitHub Actions supaya tidak butuh console/VPS.
# Runner publik gratis tanpa batas menit, jadi worker dijadwalkan tiap jam dan
# menutup diri di menit ke-55 (jeda ±5 menit untuk run berikutnya). Lock di
# MongoDB mencegah dua worker memegang sesi bersamaan.

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: 'Berapa menit worker dijalankan (maks 350)'
        required: false
        default: '55'
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: whatsapp-worker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # untuk memicu run berikutnya (worker berantai tanpa jeda)

jobs:
  worker:
    name: Baileys worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Cek secret MONGODB_URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Secret MONGODB_URI belum diset di Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "MONGODB_URI terdeteksi (${#MONGODB_URI} karakter)"

      - name: Install dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Jalankan worker
        working-directory: worker
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'fyywhatsapp' }}
          WA_SESSION_ID: ${{ vars.WA_SESSION_ID || 'default' }}
          WA_MAX_RUNTIME_MS: ${{ format('{0}', fromJSON(github.event.inputs.runtime_minutes || '55') * 60000) }}
          WORKER_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          WORKER_VERSION: '1.1.0'
          WA_LOG_LEVEL: info
        run: npm start

      # Worker mati sesuai WA_MAX_RUNTIME_MS (exit 0). Langsung picu run
      # berikutnya supaya sambungan cuma putus ±1 menit. Kalau step di atas
      # gagal, tidak ada dispatch — cron tiap jam akan mencoba lagi.
      - name: Sambung run berikutnya
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'worker.yml',
              ref: context.ref,
              inputs: { runtime_minutes: '55' },
            })
            core.info('Run worker berikutnya sudah dijadwalkan.')
